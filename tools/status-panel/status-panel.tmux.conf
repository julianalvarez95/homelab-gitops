# tmux config scoped to the status-panel session only.
# Loaded via `tmux -f status-panel.tmux.conf ...` — does not touch ~/.tmux.conf.

set -g status off
set -g mouse off
set -g allow-rename off
set -g history-limit 2000

set -g main-pane-width 65%

set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
setw -g pane-border-style fg=colour240
setw -g pane-active-border-style fg=colour39
